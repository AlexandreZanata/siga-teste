[project]
name = "siga-needle-expert"
version = "0.0.0"
description = "Nano-coprocessador Needle para navegação no SIGA — repository intelligence + context capsule"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "SIGA Needle Expert" }]
dependencies = [
  # P02-T01 + ADR-010 (docs/05): parser Java tolerante, sem JVM no runtime.
  "tree-sitter==0.25.2",
  "tree-sitter-java==0.23.5",
  # P09-T01: tokenizer BPE real para contagem exata e medição de fragmentação PT-BR.
  "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.15.18"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "context*",
  "datasets*",
  "evaluation*",
  "experiments*",
  "graph*",
  "indexer*",
  "inference*",
  "mcp*",
  "models*",
  "retrieval*",
  "task_factory*",
  "teachers*",
  "tools*",
  "training*",
  "verifier*",
]
exclude = ["tests*", "docs*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
