[project]
name = "siga-needle-expert"
version = "0.0.0"
description = "Nano-coprocessador Needle para navegação no SIGA — repository intelligence + context capsule"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "SIGA Needle Expert" }]
dependencies = [
  # P02-T01 + ADR-010 (docs/05): parser Java tolerante, sem JVM no runtime.
  "tree-sitter==0.25.2",
  "tree-sitter-java==0.23.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
