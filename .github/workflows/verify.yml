# CI de fundação (P01-T03): checkout limpo instala toolchain e `make verify` passa.
# Sem segredos, sem deploy, sem release.
# Actions fixadas por SHA (comentário = tag resolvida em 2026-09-18).

name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system deps (ripgrep)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install toolchain
        run: pip install -e ".[dev]"

      - name: Verify
        run: make verify
